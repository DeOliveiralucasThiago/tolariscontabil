[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tolaris-motor"
version = "0.1.0"
description = "Motor de cálculo tributário (Simples, Presumido, Real, PF e Reforma Tributária) com memória de cálculo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tolaris_motor = ["tabelas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
